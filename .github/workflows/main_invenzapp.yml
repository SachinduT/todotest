name: Build and deploy Node.js app to Azure Web App - invenzapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          package-manager-cache: false

      - name: Install frontend and backend dependencies
        working-directory: ./todo-react-node
        run: npm run install-all

      - name: Build React application
        working-directory: ./todo-react-node
        run: npm run build

      - name: Run tests
        working-directory: ./todo-react-node
        run: npm run test --if-present

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./todo-react-node

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "invenzapp"
          slot-name: "Production"
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_89991561979C426799DB18BBEFA637B4 }}
